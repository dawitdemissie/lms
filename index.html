<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Platform · Dawit Demissie</title>
<meta name="description" content="Course materials, announcements, assignments, exams and messages in one place.">
<meta name="theme-color" content="#0f7b6c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("dd-lms-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<script src="config.js"></script>
<style>
:root,:root[data-theme=light]{
  --bg:#f4f6f8;--panel:#fff;--raise:#fff;--soft:#f8fafb;--border:#e1e5ea;--border-strong:#cbd2da;--hover:#eef1f4;
  --text:#16181d;--muted:#5f6b78;--faint:#8a95a1;
  --accent:#0f7b6c;--accent-ink:#fff;--accent-soft:#e2f3f0;
  --amber:#b86e00;--amber-soft:#fff1d9;--cyl:#f5a742;
  --err:#c2362b;--err-soft:#fdecea;--ok:#1a7f37;--ok-soft:#e5f5ea;--info:#2f6feb;--info-soft:#e8effd;
  --shadow:0 1px 2px rgb(16 24 40/.06),0 1px 3px rgb(16 24 40/.06);
  --pop:0 16px 40px rgb(16 24 40/.18),0 2px 6px rgb(16 24 40/.08);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0c0f13;--panel:#12161c;--raise:#181d25;--soft:#151a21;--border:#262e39;--border-strong:#354050;--hover:#1e2530;
  --text:#e8edf3;--muted:#98a5b3;--faint:#6f7c8a;
  --accent:#3cc2a9;--accent-ink:#062520;--accent-soft:#12302b;
  --amber:#f0b45c;--amber-soft:#33270f;
  --err:#ff8a80;--err-soft:#3a1b1a;--ok:#4cc370;--ok-soft:#14301d;--info:#7aa7ff;--info-soft:#16233d;
  --shadow:0 1px 2px rgb(0 0 0/.4);--pop:0 16px 40px rgb(0 0 0/.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
svg:not([width]){width:1.15em;height:1.15em;flex:none}
html,body{height:100%;margin:0}
html{scroll-padding-top:76px}
html:has(.timer){scroll-padding-top:140px}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
code,pre,kbd,.mono{font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{line-height:1.25;letter-spacing:-.01em;margin:0}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .spacer{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.hidden{display:none!important}

/* buttons & inputs */
.btn{font:inherit;font-size:14px;font-weight:500;color:var(--text);background:var(--raise);border:1px solid var(--border);border-radius:9px;min-height:36px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--border-strong)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.07)}
.btn.danger{color:var(--err)} .btn.danger:hover:not(:disabled){background:var(--err-soft);border-color:var(--err)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--hover)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:36px;padding:0} .btn.sm.icon{width:30px}
.btn svg{width:16px;height:16px;flex:none}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600}
label.field>span.hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{font:inherit;font-size:14.5px;font-weight:400;color:var(--text);background:var(--panel);border:1px solid var(--border-strong);border-radius:9px;padding:8px 11px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
input[type=file]{font:inherit;font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--hover);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.err{background:var(--err-soft);color:var(--err)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* app shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .logo img{display:block;height:42px;width:auto}
.course-id{display:flex;flex-direction:column;line-height:1.2;padding-left:14px;border-left:1px solid var(--border);min-width:0}
.course-id b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-id span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:999px;padding:3px 12px 3px 3px;background:var(--raise);cursor:pointer;font:inherit;color:var(--text)}
.who:hover{background:var(--hover)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.who .nm{font-size:13.5px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .rl{font-size:11.5px;color:var(--muted)}
.demo-pick{display:flex;align-items:center;gap:8px;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:4px 6px 4px 12px;font-size:12.5px;font-weight:600}
.demo-pick select{width:auto;padding:4px 8px;font-size:13px;border-radius:7px}
.banner{display:flex;gap:10px;align-items:center;padding:8px 18px;background:var(--amber-soft);color:var(--text);font-size:13.5px;border-bottom:1px solid var(--border)}
.banner svg{color:var(--amber);flex:none}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100% - 59px)}
nav.side{border-right:1px solid var(--border);background:var(--panel);padding:14px 10px;position:sticky;top:59px;align-self:start;height:calc(100vh - 59px);overflow:auto}
nav.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px}
nav.side a:hover{background:var(--hover);color:var(--text)}
nav.side a.on{background:var(--accent-soft);color:var(--text);font-weight:600}
nav.side a.on svg{color:var(--accent)}
nav.side a svg{width:18px;height:18px;flex:none}
nav.side .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
nav.side .badge.amber{background:var(--cyl);color:#1b1206}
nav.side .sep{height:1px;background:var(--border);margin:10px 8px}
nav.side .label{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:4px 12px}
main{padding:26px 30px 60px;min-width:0}
.page{max-width:1080px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head .sub{color:var(--muted);margin-top:4px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted);text-decoration:none} .crumb a:hover{color:var(--accent)}

/* cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-body{padding:16px 18px}
.list>.item{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--border);text-decoration:none;color:inherit}
.list>.item:first-child{border-top:0}
a.item:hover,button.item:hover{background:var(--soft)}
button.item{width:100%;text-align:left;font:inherit;background:none;border:0;border-top:1px solid var(--border);cursor:pointer}
.item .ttl{font-weight:600}
.item .meta{font-size:13px;color:var(--muted)}
.tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile svg{width:19px;height:19px}
.t-teal{background:#0f7b6c} .t-amber{background:#e0951f} .t-blue{background:#2f6feb} .t-purple{background:#8b4fd6} .t-ink{background:#2d3440} .t-red{background:#c2362b}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat b{font-size:24px;line-height:1;display:block}
.stat div>span{font-size:13px;color:var(--muted)}
.hero{padding:26px 28px;background:linear-gradient(135deg,var(--panel) 55%,var(--accent-soft));position:relative;overflow:hidden;margin-bottom:18px}
.hero .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--amber);font-weight:600}
.hero h1{margin:6px 0 8px;font-size:28px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:8px}

/* rich text */
.md{line-height:1.65;overflow-wrap:anywhere}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{margin:14px 0 8px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md code{background:var(--hover);padding:1px 5px;border-radius:5px;font-size:.9em}
.md pre{background:var(--soft);border:1px solid var(--border);padding:12px 14px;border-radius:10px;overflow:auto;font-size:13.5px}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 10px;padding:4px 14px;border-left:3px solid var(--cyl);color:var(--muted)}

/* tables */
.table-wrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--soft)}
table.t td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t input[type=number]{width:84px;padding:5px 8px}
table.t input[type=text]{padding:5px 8px;min-width:160px}

/* materials */
.module{margin-bottom:14px}
.module .card-head h3{flex:1}
.mat{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:1px solid var(--border)}
.mat:first-child{border-top:0}
.mat .tile{width:32px;height:32px;border-radius:8px}
.mat .tile svg{width:16px;height:16px}
.mat details summary{cursor:pointer;font-weight:600;list-style:none}
.mat details summary::-webkit-details-marker{display:none}
.mat details[open] summary{margin-bottom:8px}
.mat .tools{margin-left:auto;display:flex;gap:2px;opacity:.0;transition:opacity .12s}
.mat:hover .tools,.module .card-head:hover .tools,.mat .tools:focus-within,.module .card-head .tools:focus-within{opacity:1}
.module .card-head .tools{display:flex;gap:2px;opacity:0;transition:opacity .12s}
@media (hover:none){.mat .tools,.module .card-head .tools{opacity:1}}

/* exams */
.q{padding:18px 20px;border-top:1px solid var(--border)}
.q:first-child{border-top:0}
.q .qn{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.q .prompt{margin:4px 0 12px;font-weight:500}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.timer{position:sticky;top:59px;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:14px;border-radius:12px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow)}
.timer .clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:700}
.timer.low{border-color:var(--err);background:var(--err-soft)} .timer.low .clock{color:var(--err)}
.timer .bar{flex:1;height:6px;border-radius:999px;background:var(--hover);overflow:hidden}
.timer .bar span{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.timer.low .bar span{background:var(--err)}
.qedit{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--soft)}
.qedit .opts .row{margin-bottom:6px;flex-wrap:nowrap}
.mark{font-size:13px;font-weight:700} .mark.ok{color:var(--ok)} .mark.bad{color:var(--err)} .mark.pend{color:var(--amber)}
.answer-box{background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:9px 12px;white-space:pre-wrap;font-size:14px}

/* messages */
.inbox{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:520px}
.inbox .threads{border-right:1px solid var(--border);overflow:auto;max-height:70vh}
.thread{display:flex;flex-direction:column;min-height:520px;max-height:72vh}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:72%;padding:9px 13px;border-radius:14px;background:var(--hover);white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:4px}
.bubble .when{display:block;font-size:11px;opacity:.75;margin-top:3px}
.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border)}
.composer textarea{min-height:44px;height:44px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* overlays */
.modal-back{position:fixed;inset:0;background:rgb(8 12 18/.5);backdrop-filter:blur(2px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--pop);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal header{padding:18px 22px 6px;display:flex;align-items:center;gap:10px}
.modal header h2{flex:1}
.modal .mbody{padding:10px 22px 16px;overflow:auto}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border);background:var(--soft);border-radius:0 0 16px 16px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--raise);border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop);padding:6px;min-width:220px;z-index:40}
.menu button{display:flex;gap:10px;align-items:center;width:100%;font:inherit;font-size:14px;background:none;border:0;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--hover)}
.menu .mh{padding:8px 12px 10px;border-bottom:1px solid var(--border);margin-bottom:4px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--text);color:var(--panel);padding:10px 18px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:var(--pop);z-index:90;transition:opacity .2s,transform .2s;pointer-events:none;max-width:min(560px,92vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err);color:#fff}

/* sign-in */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,var(--accent-soft),transparent 45%),radial-gradient(circle at 85% 90%,var(--amber-soft),transparent 40%),var(--bg)}
.auth .card{width:min(440px,100%);padding:30px 30px 26px}
.auth img{height:54px;display:block;margin:0 auto 22px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.menu-btn{display:none}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))} .course-id{display:none}}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:59px;bottom:0;width:260px;height:auto;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--pop)}
  body.nav-open nav.side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:59px 0 0;background:rgb(8 12 18/.4);z-index:25}
  .menu-btn{display:inline-flex}
  main{padding:18px 14px 50px}
  .top{padding:8px 10px;gap:8px}
  .top .logo img{height:32px}
  .who .nm,.who .rl,.demo-pick .lbl{display:none}
  .top .logo{min-width:0;flex-shrink:1} .top .logo img{max-width:100%;object-fit:contain;object-position:left}
  .demo-pick{padding:3px;min-width:0;flex-shrink:1} .demo-pick select{max-width:118px}
  .top .spacer{display:none} .demo-pick{margin-left:auto}
  .page-head>.row{width:100%}
  .who{padding:3px}
  .grid2,.grid3{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}
  .inbox .threads{border-right:0;border-bottom:1px solid var(--border);max-height:220px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<div id="app"><div class="loading"><span><span class="spin"></span>&nbsp; Loading…</span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ============================== basics ============================== */
const CFG = window.LMS_CONFIG || {};
const DEMO = !(CFG.supabaseUrl && CFG.supabaseAnonKey);
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const byPos = (a, b) => (a.position ?? 0) - (b.position ?? 0) || String(a.created_at).localeCompare(String(b.created_at));
const num = v => (v === null || v === undefined || v === "" ? null : Number(v));
const fmtNum = v => (v === null || v === undefined ? "–" : (Math.round(Number(v) * 100) / 100).toLocaleString());
const safeFile = n => String(n).replace(/[^\w.\-]+/g, "_").slice(-80) || "file";

function fmtDate(iso, opts) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString(undefined, opts || { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function fmtDay(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : ""; }
function relTime(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000, a = Math.abs(s);
  const r = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  if (a < 60) return s < 0 ? "just now" : "in a moment";
  if (a < 3600) return r.format(Math.round(s / 60), "minute");
  if (a < 86400) return r.format(Math.round(s / 3600), "hour");
  if (a < 86400 * 30) return r.format(Math.round(s / 86400), "day");
  return fmtDay(iso);
}
/* <input type=datetime-local> uses local time without a zone */
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso), p = n => String(n).padStart(2, "0");

/* ======================= safe Markdown subset ======================= */
function md(src) {
  src = String(src || "").replace(/\r\n?/g, "\n");
  const keep = [];
  const hold = html => "\u0001" + (keep.push(html) - 1) + "\u0002";
  src = src.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => "\n" + hold("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>") + "\n");
  const inline = s => {
    s = s.replace(/`([^`\n]+)`/g, (m, c) => hold("<code>" + esc(c) + "</code>"));
    s = s.replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/g, (m, t, u) => hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`));
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g, (m, pre, u) => pre + hold(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
    s = esc(s)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, "$1<em>$2</em>")
      .replace(/(^|[^_\w])_([^_\s][^_\n]*?)_(?!\w)/g, "$1<em>$2</em>");
    return s;
  };
  const out = [];
  for (const block of src.split(/\n{2,}/)) {
    const lines = block.split("\n").filter(l => l.trim() !== "");
    if (!lines.length) continue;
    if (lines.length === 1 && /^\u0001\d+\u0002$/.test(lines[0].trim())) { out.push(lines[0].trim()); continue; }
    if (lines.every(l => /^\s*[-*]\s+/.test(l))) { out.push("<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>"); continue; }
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) { out.push("<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>"); continue; }
    if (lines.every(l => /^\s*>/.test(l))) { out.push("<blockquote>" + lines.map(l => inline(l.replace(/^\s*>\s?/, ""))).join("<br>") + "</blockquote>"); continue; }
    const h = lines[0].match(/^(#{1,3})\s+(.*)$/);
    if (h && lines.length === 1) { const n = h[1].length + 1; out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
    out.push("<p>" + lines.map(inline).join("<br>") + "</p>");
  }
  return out.join("\n").replace(/\u0001(\d+)\u0002/g, (m, i) => keep[+i]);
}

// Mirrors public.submit_exam() in supabase/setup.sql.
function gradeExam(questions, keys, answers) {
  let auto = 0, max = 0, review = false;
  const per = {};
  for (const q of questions) {
    const pts = Number(q.points) || 0; max += pts;
    const a = answers?.[q.id], k = keys[q.id];
    let got = 0, state = "wrong";
    if (q.kind === "mc" || q.kind === "tf") {
      if (a !== undefined && a !== null && k !== undefined && k !== null && String(a).toLowerCase() === String(k).toLowerCase()) { got = pts; state = "right"; }
    } else if (q.kind === "short" && Array.isArray(k) && k.length) {
      if (a && k.some(x => String(x).trim().toLowerCase() === String(a).trim().toLowerCase())) { got = pts; state = "right"; }
    } else { review = true; state = "review"; }
    auto += got; per[q.id] = { got, state };
  }
  return { auto, max, review, per };
}

      case "assignments": case "exams": return r.published;
      case "submissions": case "messages": case "exam_attempts": return r.student_id === me;
      case "exam_results": return r.student_id === me && (r.released || this.d.exams.find(e => e.id === r.exam_id)?.show_results);
      case "exam_questions": return this.d.exam_attempts.some(a => a.exam_id === r.exam_id && a.student_id === me);

  async list(table, { eq = {}, order, desc } = {}) {
    let rows = (this.d[table] || []).filter(r => this.visible(table, r) && Object.entries(eq).every(([k, v]) => r[k] === v));
    rows = rows.map(r => JSON.parse(JSON.stringify(r)));
    if (order) rows.sort((a, b) => (a[order] > b[order] ? 1 : a[order] < b[order] ? -1 : 0) * (desc ? -1 : 1));
    return rows;
  }
  async save(table, row, pk = "id") {
    if (table === "course") { this.need(); Object.assign(this.d.course, row, { updated_at: nowIso() }); this.persist(); return this.d.course; }
    const list = this.d[table] || (this.d[table] = []);
    const i = row[pk] ? list.findIndex(r => r[pk] === row[pk]) : -1;
    let next;
    if (i >= 0) {
      const old = list[i];
      next = { ...old, ...row };
      if (table === "submissions") {
        if (this.isInstructor) { next.submitted_at = old.submitted_at; if (next.grade !== old.grade || next.feedback !== old.feedback) next.graded_at = nowIso(); }
        else { if (old.grade !== null && old.grade !== undefined) throw new Error("This submission has been graded, so it can't be changed."); Object.assign(next, { student_id: old.student_id, grade: old.grade, feedback: old.feedback, graded_at: old.graded_at, submitted_at: nowIso() }); }
      } else if (table === "profiles" && !this.isInstructor) { next.role = old.role; next.email = old.email; }
      else if (!["profiles", "messages"].includes(table)) this.need();
      list[i] = next;
    } else {
      next = { created_at: nowIso(), ...row };
      if (pk === "id" && !next.id) next.id = uid();
      if (table === "submissions") {
        if (!this.isInstructor) Object.assign(next, { student_id: this.me.id, grade: null, feedback: null, graded_at: null, submitted_at: nowIso() });
      } else if (table === "messages") { next.sender_id = this.me.id; if (!this.isInstructor) next.student_id = this.me.id; next.read_at = null; }
      else if (table !== "profiles") this.need();
      list.push(next);
    }
    this.persist();
    return JSON.parse(JSON.stringify(next));
  }
  async insertMany(table, rows) { for (const r of rows) await this.save(table, r, table === "exam_keys" ? "question_id" : "id"); }
  async remove(table, id, pk = "id") {
    this.need();
    const cascade = { modules: [["materials", "module_id"]], assignments: [["submissions", "assignment_id"]], exams: [["exam_questions", "exam_id"], ["exam_attempts", "exam_id"], ["exam_results", "exam_id"]], exam_questions: [["exam_keys", "question_id"]] };
    const kill = (t, col, val) => {
      for (const r of (this.d[t] || []).filter(r => r[col] === val)) for (const [ct, cc] of cascade[t] || []) kill(ct, cc, r.id);
      this.d[t] = (this.d[t] || []).filter(r => r[col] !== val);

    if (table === "materials" || table === "submissions") {/* files stay in the demo store until reset */}
    this.persist();
  }

const sleep = ms => new Promise(r => setTimeout(r, ms));
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load " + src)); document.head.appendChild(s); });
}
class SupaStore {
  async init() {
    if (!window.supabase) await loadScript(SUPABASE_JS);
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } });
  }
  async session() {
    const { data, error } = await this.sb.auth.getSession();
    if (error) throw error;
    if (!data.session) return null;
    this.user = data.session.user;
    for (let i = 0; i < 5; i++) {
      const r = await this.sb.from("profiles").select("*").eq("id", this.user.id).maybeSingle();
      if (r.error) throw r.error;
      if (r.data) return (this.me = r.data);
      await sleep(700);
    }
    throw new Error("Your account has no profile yet. Make sure supabase/setup.sql was run, then sign in again.");
  }
  async signIn(email) {
    const { error } = await this.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
    if (error) throw error;
  }
  async signInPassword(email, password) {
    const { error } = await this.sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
  }
  async signUp(fullName, email, password) {
    const { data, error } = await this.sb.auth.signUp({ email, password, options: { data: { full_name: fullName }, emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
    return !!data.session; // false when Supabase wants the email confirmed first
  }
  async resetPassword(email) {
    const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) throw error;
  }
  async updatePassword(password) { const { error } = await this.sb.auth.updateUser({ password }); if (error) throw error; }
  async signOut() { await this.sb.auth.signOut(); }
  get isInstructor() { return this.me?.role === "instructor"; }
  async getCourse() {
    const { data, error } = await this.sb.from("course").select("*").eq("id", 1).maybeSingle();
    if (error) throw error;
    return data || { title: "My Course", code: "", term: "", description: "" };
  }
  async list(table, { eq = {}, order, desc } = {}) {
    let q = this.sb.from(table).select("*");
    for (const [k, v] of Object.entries(eq)) q = q.eq(k, v);
    if (order) q = q.order(order, { ascending: !desc });
    const { data, error } = await q;
    if (error) throw error;
    return data || [];
  }
  async save(table, row, pk = "id", opts = {}) {
    const clean = Object.fromEntries(Object.entries(row).filter(([k, v]) => v !== undefined && !k.startsWith("_")));
    if (table === "course") {
      delete clean.id; delete clean.updated_at;
      const { data, error } = await this.sb.from("course").update(clean).eq("id", 1).select().single();
      if (error) throw error; return data;
    }
    if (clean[pk] && !opts.insert) {
      const id = clean[pk]; delete clean[pk];
      const { data, error } = await this.sb.from(table).update(clean).eq(pk, id).select().maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("That couldn't be saved. It may have been deleted, or you don't have permission to change it.");
      return data;
    }
    const { data, error } = await this.sb.from(table).insert(clean).select().single();
    if (error) throw error;
    return data;
  }
  async insertMany(table, rows) { if (!rows.length) return; const { error } = await this.sb.from(table).insert(rows); if (error) throw error; }
  async remove(table, id, pk = "id") { const { error } = await this.sb.from(table).delete().eq(pk, id); if (error) throw error; }
  async removeWhere(table, col, values) { if (!values.length) return; const { error } = await this.sb.from(table).delete().in(col, values); if (error) throw error; }
  async markRead(studentId) {
    const { error } = await this.sb.from("messages").update({ read_at: nowIso() }).eq("student_id", studentId).neq("sender_id", this.me.id).is("read_at", null);
    if (error) throw error;
  }
  async startExam(examId) { const { data, error } = await this.sb.rpc("start_exam", { p_exam: examId }); if (error) throw error; return data; }
  async submitExam(examId, answers) { const { data, error } = await this.sb.rpc("submit_exam", { p_exam: examId, p_answers: answers || {} }); if (error) throw error; return data; }
  async upload(bucket, path, file) {
    if (file.size > 25 * 1024 * 1024) throw new Error("Files must be under 25 MB.");
    const { error } = await this.sb.storage.from(bucket).upload(path, file, { upsert: true, contentType: file.type || undefined });
    if (error) throw error;
    return path;
  }
  async fileUrl(bucket, path) {
    const { data, error } = await this.sb.storage.from(bucket).createSignedUrl(path, 3600);
    if (error) throw error;
    return data.signedUrl;
  }
}

function modal({ title, body, ok = "Save", okClass = "primary", wide, cancel = "Cancel", onOk, onMount }) {
  return new Promise(resolve => {
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<form class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
      <header><h2>${esc(title)}</h2><button type="button" class="btn ghost icon" data-x aria-label="Close">${ic("x")}</button></header>
      <div class="mbody">${body}</div>
      <footer>${cancel ? `<button type="button" class="btn" data-x>${esc(cancel)}</button>` : ""}${ok ? `<button type="submit" class="btn ${okClass}">${esc(ok)}</button>` : ""}</footer></form>`;
    const prev = document.activeElement;
    const close = v => { back.remove(); document.removeEventListener("keydown", onKey); prev?.focus?.(); resolve(v); };
    const onKey = e => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", onKey);
    back.addEventListener("mousedown", e => { if (e.target === back) close(null); });
    $$("[data-x]", back).forEach(b => b.onclick = () => close(null));
    const form = $("form", back);
    form.onsubmit = async e => {
      e.preventDefault();
      const btn = $("footer button[type=submit]", back);
      if (!onOk) return close(true);
      btn.disabled = true; const label = btn.textContent; btn.innerHTML = `<span class="spin" style="width:16px;height:16px;border-width:2px"></span> ${esc(label)}`;
      try { const r = await onOk(form); if (r !== false) close(r === undefined ? true : r); }
      catch (err) { toast(errMsg(err), true); }
      finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
    };
    document.body.appendChild(back);
    onMount?.(form);
    (form.querySelector("[autofocus]") || form.querySelector("input,textarea,select,button[type=submit]"))?.focus();
  });
}
const confirmBox = (title, text, ok = "Delete") => modal({ title, body: `<p>${text}</p>`, ok, okClass: ok === "Delete" ? "btn danger" : "primary" });
const fval = (form, n) => form.elements[n]?.value?.trim() ?? "";

ROUTES.materials = async tok => {
  const t = isT(), st = store();
  const [mods, mats] = await Promise.all([st.list("modules"), st.list("materials")]);
  mods.sort(byPos);
  const kindTile = { note: ["t-teal", "note"], link: ["t-blue", "link"], file: ["t-amber", "file"] };
  const item = (m, i, arr) => {
    const [cls, icon] = kindTile[m.kind] || kindTile.note;
    const tools = t ? `<div class="tools"><button class="btn sm ghost icon" data-mv="${m.id}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Move up">${ic("up")}</button><button class="btn sm ghost icon" data-mv="${m.id}" data-dir="1" ${i === arr.length - 1 ? "disabled" : ""} aria-label="Move down">${ic("down")}</button><button class="btn sm ghost icon" data-edit-mat="${m.id}" aria-label="Edit">${ic("edit")}</button><button class="btn sm ghost icon" data-del-mat="${m.id}" aria-label="Delete">${ic("trash")}</button></div>` : "";

    if (m.kind === "note") main = `<details ${arr.length === 1 ? "open" : ""}><summary>${esc(m.title)}</summary><div class="md">${md(m.body)}</div></details>`;
    else if (m.kind === "link") main = `<a href="${esc(/^https?:\/\//i.test(m.url || "") ? m.url : "#")}" target="_blank" rel="noopener" style="font-weight:600">${esc(m.title)}</a>${m.body ? `<div class="small muted">${esc(m.body)}</div>` : ""}`;
    else main = `<button class="btn sm" data-file="${esc(m.file_path || "")}" data-name="${esc(m.file_name || "")}">${ic("download")} ${esc(m.title)}</button><div class="small muted" style="margin-top:4px">${esc(m.file_name || "")}${m.body ? " · " + esc(m.body) : ""}</div>`;
    return `<div class="mat"><span class="tile ${cls}">${ic(icon)}</span><div style="flex:1;min-width:0">${main}</div>${tools}</div>`;
  };
  const ok = paint(tok, head("Materials", "Notes, links and files, organised by week.", t ? `<button class="btn primary" id="addMod">${ic("plus")} Add module</button>` : "") +
    (mods.length ? mods.map((mo, i) => { const items = mats.filter(m => m.module_id === mo.id).sort(byPos); return `<section class="card module">
      <div class="card-head"><span class="tile t-ink" style="width:30px;height:30px;border-radius:8px">${ic("book", 15)}</span><h3>${esc(mo.title)}</h3>
        ${t ? `<div class="tools"><button class="btn sm ghost icon" data-mvmod="${mo.id}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Move module up">${ic("up")}</button><button class="btn sm ghost icon" data-mvmod="${mo.id}" data-dir="1" ${i === mods.length - 1 ? "disabled" : ""} aria-label="Move module down">${ic("down")}</button><button class="btn sm ghost icon" data-edit-mod="${mo.id}" aria-label="Rename module">${ic("edit")}</button><button class="btn sm ghost icon" data-del-mod="${mo.id}" aria-label="Delete module">${ic("trash")}</button></div><button class="btn sm" data-add-mat="${mo.id}">${ic("plus")} Add item</button>` : ""}</div>
      <div>${items.map(item).join("") || `<div class="mat muted small">Nothing here yet.</div>`}</div></section>`; }).join("")
      : `<div class="card">${empty("book", t ? "Start by adding a module, such as “Week 1”." : "Your instructor hasn't added materials yet.")}</div>`));
  if (!ok) return;
  $$("[data-file]").forEach(b => b.onclick = () => openFile("materials", b.dataset.file, b.dataset.name));
  if (!t) return;

  const modEditor = mo => modal({
    title: mo ? "Rename module" : "Add module",
    body: `<label class="field">Module name<input type="text" name="title" required maxlength="120" placeholder="Week 4 · Grouping" value="${esc(mo?.title || "")}" autofocus></label>`,
    onOk: async f => {
      if (!fval(f, "title")) { toast("Give the module a name.", true); return false; }
      await st.save("modules", { id: mo?.id, title: fval(f, "title"), position: mo ? mo.position : Math.max(0, ...mods.map(m => m.position || 0)) + 1 });
      render();
    }
  });
  const matEditor = (moduleId, m) => modal({
    title: m ? "Edit item" : "Add item",
    body: `<div class="stack">
      <label class="field">Type<select name="kind" ${m ? "disabled" : ""}><option value="note">Note (text you write here)</option><option value="link">Link to a website or video</option><option value="file">File (PDF, slides, data…)</option></select></label>
      <label class="field">Title<input type="text" name="title" required maxlength="140" value="${esc(m?.title || "")}" autofocus></label>
      <label class="field k-link">Web address<input type="text" name="url" placeholder="https://…" value="${esc(m?.url || "")}"></label>
      <label class="field k-file">File ${m?.file_name ? `<span class="hint">Current: ${esc(m.file_name)}. Choose a new file to replace it.</span>` : ""}<input type="file" name="file"></label>
      <label class="field"><span class="k-note">Text <span class="hint">Formatting: **bold**, *italic*, - lists, \`code\`, \`\`\` code blocks \`\`\`</span></span><span class="k-other">Short description (optional)</span><textarea name="body" rows="8">${esc(m?.body || "")}</textarea></label></div>`,
    wide: true,
    onMount: f => {
      const sel = f.elements.kind; if (m) sel.value = m.kind;
      const sync = () => { const k = sel.value; $$(".k-link", f).forEach(e => e.classList.toggle("hidden", k !== "link")); $$(".k-file", f).forEach(e => e.classList.toggle("hidden", k !== "file")); $$(".k-note", f).forEach(e => e.classList.toggle("hidden", k !== "note")); $$(".k-other", f).forEach(e => e.classList.toggle("hidden", k === "note")); f.elements.body.rows = k === "note" ? 10 : 3; };
      sel.onchange = sync; sync();
    },
    onOk: async f => {
      const kind = m ? m.kind : f.elements.kind.value, title = fval(f, "title"), url = fval(f, "url"), file = f.elements.file.files[0];
      if (!title) { toast("Add a title.", true); return false; }
      if (kind === "link" && !/^https?:\/\/\S+$/i.test(url)) { toast("Enter a full web address starting with https://", true); return false; }
      if (kind === "file" && !file && !m?.file_path) { toast("Choose a file to upload.", true); return false; }
      const row = { id: m?.id, module_id: moduleId, kind, title, body: f.elements.body.value, url: kind === "link" ? url : null };
      if (file) { const path = `${moduleId}/${Date.now()}-${safeFile(file.name)}`; await st.upload("materials", path, file); row.file_path = path; row.file_name = file.name; }
      if (!m) row.position = Math.max(0, ...mats.filter(x => x.module_id === moduleId).map(x => x.position || 0)) + 1;
      await st.save("materials", row);
      toast(m ? "Item updated" : "Item added"); render();
    }
  });
  const swap = async (table, arr, id, dir) => {
    const i = arr.findIndex(x => x.id === id), j = i + dir; if (j < 0 || j >= arr.length) return;
    const next = arr.slice(); [next[i], next[j]] = [next[j], next[i]];
    for (const [k, x] of next.entries()) if (x.position !== k + 1) await st.save(table, { id: x.id, position: k + 1 });
    render();
  };
  $("#addMod").onclick = () => modEditor(null);
  $$("[data-edit-mod]").forEach(b => b.onclick = () => modEditor(mods.find(m => m.id === b.dataset.editMod)));
  $$("[data-del-mod]").forEach(b => b.onclick = async () => { const n = mats.filter(m => m.module_id === b.dataset.delMod).length; if (await confirmBox("Delete module?", `This also deletes the ${n} item${n === 1 ? "" : "s"} inside it.`)) { await st.remove("modules", b.dataset.delMod); toast("Module deleted"); render(); } });
  $$("[data-mvmod]").forEach(b => b.onclick = () => swap("modules", mods, b.dataset.mvmod, +b.dataset.dir));
  $$("[data-add-mat]").forEach(b => b.onclick = () => matEditor(b.dataset.addMat, null));
  $$("[data-edit-mat]").forEach(b => b.onclick = () => { const m = mats.find(x => x.id === b.dataset.editMat); matEditor(m.module_id, m); });
  $$("[data-del-mat]").forEach(b => b.onclick = async () => { if (await confirmBox("Delete item?", "Students will no longer see it.")) { await st.remove("materials", b.dataset.delMat); toast("Item deleted"); render(); } });
  $$("[data-mv]").forEach(b => b.onclick = () => { const m = mats.find(x => x.id === b.dataset.mv); swap("materials", mats.filter(x => x.module_id === m.module_id).sort(byPos), m.id, +b.dataset.dir); });
};

/* ============================ assignments ============================ */
function subStatus(a, s) {
  if (s && s.grade !== null && s.grade !== undefined) return `<span class="chip ok">${ic("check", 12)} ${fmtNum(s.grade)} / ${fmtNum(a.points)}</span>`;
  if (s) return `<span class="chip info">Submitted${a.due_at && s.submitted_at > a.due_at ? " late" : ""}</span>`;
  if (a.due_at && new Date(a.due_at) < Date.now()) return `<span class="chip err">Missing</span>`;
  return `<span class="chip">Not submitted</span>`;
}
function assignmentEditor(a) {
  return modal({
    title: a ? "Edit assignment" : "New assignment", ok: a ? "Save" : "Create", wide: true,
    body: `<div class="stack">
      <label class="field">Title<input type="text" name="title" required maxlength="140" value="${esc(a?.title || "")}" autofocus></label>
      <label class="field">Instructions <span class="hint">Formatting: **bold**, *italic*, - and 1. lists, \`code\`, links.</span><textarea name="instructions" rows="9">${esc(a?.instructions || "")}</textarea></label>
      <div class="grid3"><label class="field">Due<input type="datetime-local" name="due" value="${toLocalInput(a?.due_at)}"></label>
        <label class="field">Points<input type="number" name="points" min="0" step="any" value="${esc(a?.points ?? 100)}"></label>
        <div class="field">Students can submit<label class="check"><input type="checkbox" name="text" ${a?.allow_text ?? true ? "checked" : ""}> Text</label><label class="check"><input type="checkbox" name="file" ${a?.allow_file ?? true ? "checked" : ""}> A file</label></div></div>
      <label class="check"><input type="checkbox" name="published" ${a?.published ? "checked" : ""}> Published (students can see it)</label></div>`,
    onOk: async f => {
      if (!fval(f, "title")) { toast("Add a title.", true); return false; }
      if (!f.elements.text.checked && !f.elements.file.checked) { toast("Allow text, a file, or both.", true); return false; }
      const row = await store().save("assignments", { id: a?.id, title: fval(f, "title"), instructions: f.elements.instructions.value, due_at: fromLocalInput(f.elements.due.value), points: num(f.elements.points.value) ?? 0, allow_text: f.elements.text.checked, allow_file: f.elements.file.checked, published: f.elements.published.checked });
      toast(a ? "Assignment saved" : "Assignment created");
      if (!a) location.hash = "#/assignments/" + row.id; else render();
    }
  });
}

          total += v;
        }
        if (missing && !(await confirmBox("Some answers aren't marked", `${missing} answer${missing === 1 ? " has" : "s have"} no points yet. Save anyway? This attempt will stay marked “Needs marking”.`, "Save anyway"))) return false;
        await st.save("exam_results", { attempt_id: at.id, manual, total, needs_review: missing > 0, released: f.elements.release.checked }, "attempt_id");
        toast("Marks saved"); render();
      }
    });
  });
}

async function examTake(tok, id) {
  const st = store();
  const [e] = await st.list("exams", { eq: { id } });
  const [att] = await st.list("exam_attempts", { eq: { exam_id: id } });
  if (!e || !att) { location.hash = "#/exams/" + id; return; }
  if (att.submitted_at) { location.hash = "#/exams/" + id; return; }
  const qs = (await st.list("exam_questions", { eq: { exam_id: id } })).sort(byPos);
  const draftKey = "dd-lms-answers-" + att.id;
  let answers = {}; try { answers = JSON.parse(localStorage.getItem(draftKey)) || {}; } catch {}
  const ends = [e.time_limit_min ? new Date(att.started_at).getTime() + e.time_limit_min * 60000 : null, e.closes_at ? new Date(e.closes_at).getTime() : null].filter(Boolean);
  const deadline = ends.length ? Math.min(...ends) : null, total = deadline ? deadline - new Date(att.started_at).getTime() : null;
  const ok = paint(tok, `<div class="crumb"><a href="#/exams">Exams</a> / ${esc(e.title)}</div>
    ${deadline ? `<div class="timer" id="timer">${ic("clock", 20)}<span class="clock" id="clock">--:--</span><span class="small muted">left</span><div class="bar"><span id="bar"></span></div><button class="btn primary sm" id="submitTop">Submit</button></div>` : ""}
    <form class="card" id="examForm">${qs.map((q, i) => `<div class="q"><div class="qn">Question ${i + 1} of ${qs.length} · ${fmtNum(q.points)} pt${q.points == 1 ? "" : "s"}</div><div class="prompt md">${md(q.prompt)}</div>
      ${q.kind === "mc" ? (q.options || []).map((o, j) => `<label class="opt"><input type="radio" name="${q.id}" value="${j}" ${String(answers[q.id]) === String(j) ? "checked" : ""}> <span>${esc(o)}</span></label>`).join("")
        : q.kind === "tf" ? ["true", "false"].map(v => `<label class="opt"><input type="radio" name="${q.id}" value="${v}" ${String(answers[q.id]) === v ? "checked" : ""}> <span>${v === "true" ? "True" : "False"}</span></label>`).join("")
        : q.kind === "short" ? `<input type="text" name="${q.id}" maxlength="500" value="${esc(answers[q.id] || "")}" placeholder="Your answer">`
        : `<textarea name="${q.id}" rows="6" placeholder="Your answer">${esc(answers[q.id] || "")}</textarea>`}</div>`).join("") || empty("exam", "This exam has no questions.")}
      <div class="q row"><span class="small muted">Your answers are saved on this device as you go.</span><span class="spacer"></span><button class="btn primary" type="submit">${ic("send")} Submit exam</button></div></form>`);
  if (!ok) return;
  const form = $("#examForm");
  const collect = () => { const a = {}; for (const q of qs) { const el = form.elements[q.id]; if (!el) continue; const v = q.kind === "mc" || q.kind === "tf" ? (form.querySelector(`[name="${q.id}"]:checked`)?.value) : el.value; if (v !== undefined && v !== "") a[q.id] = q.kind === "mc" ? Number(v) : q.kind === "tf" ? v === "true" : v; } return a; };
  form.addEventListener("input", () => { answers = collect(); try { localStorage.setItem(draftKey, JSON.stringify(answers)); } catch {} });
  let done = false;
  const submit = async auto => {
    if (done) return;
    answers = collect();
    if (!auto) {
      const blank = qs.filter(q => answers[q.id] === undefined).length;
      if (!(await modal({ title: "Submit your exam?", body: `<p>${blank ? `<b>${blank} question${blank === 1 ? " is" : "s are"} unanswered.</b> ` : "All questions are answered. "}You can't change your answers after submitting.</p>`, ok: "Submit" }))) return;
    }
    done = true; clearTimers();
    try {
      const r = await st.submitExam(id, answers);
      try { localStorage.removeItem(draftKey); } catch {}
      toast(auto ? "Time's up, so your exam was submitted." : r && !r.hidden ? `Submitted! You scored ${fmtNum(r.total)} / ${fmtNum(r.max)}${r.needs_review ? " so far" : ""}.` : "Submitted!");
      location.hash = "#/exams/" + id;
    } catch (err) { done = false; toast(errMsg(err), true); }
  };
  form.onsubmit = ev => { ev.preventDefault(); submit(false); };
  $("#submitTop")?.addEventListener("click", () => submit(false));
  window.onbeforeunload = () => "Your exam is still in progress.";
  if (deadline) {
    const tickFn = () => {
      const left = deadline - Date.now();
      if (left <= 0) { $("#clock").textContent = "0:00"; submit(true); return; }
      const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
      $("#clock").textContent = (m >= 60 ? Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
      $("#bar").style.width = Math.max(0, Math.min(100, (left / total) * 100)) + "%";
      $("#timer").classList.toggle("low", left < 60000 * Math.min(5, Math.max(1, (total / 60000) * 0.15)));
    };
    tickFn(); S.timers.push(setInterval(tickFn, 1000));
  }
}

async function examEditor(tok, id) {
  const st = store();
  if (!isT()) { location.hash = "#/exams"; return; }
  let e = { title: "", instructions: "", time_limit_min: 30, opens_at: null, closes_at: null, show_results: true, published: false };
  let qs = [], attempts = 0;
  if (id) {
    const [ex] = await st.list("exams", { eq: { id } }); if (!ex) { location.hash = "#/exams"; return; }
    e = ex;
    const [qq, keys, at] = await Promise.all([st.list("exam_questions", { eq: { exam_id: id } }), st.list("exam_keys"), st.list("exam_attempts", { eq: { exam_id: id } })]);
    const k = Object.fromEntries(keys.map(x => [x.question_id, x.answer]));
    qs = qq.sort(byPos).map(q => ({ ...q, options: [...(q.options || [])], answer: k[q.id] ?? null }));
    attempts = at.length;
  }
  const origIds = qs.map(q => q.id);
  const ok = paint(tok, head(id ? "Edit exam" : "New exam", "", "", `<a href="#/exams">Exams</a> /${id ? ` <a href="#/exams/${id}">${esc(e.title)}</a> /` : ""}`) + `
    ${attempts ? `<div class="card pad row" style="margin-bottom:16px;border-color:var(--amber)">${ic("info")}<span><b>${attempts} student${attempts === 1 ? " has" : "s have"} already started this exam.</b> Changing questions or answers won't re-mark their attempts.</span></div>` : ""}
    <form id="exForm" class="stack">
      <div class="card pad stack">
        <label class="field">Title<input type="text" name="title" required maxlength="140" value="${esc(e.title)}" placeholder="Quiz 2 · Grouping"></label>
        <label class="field">Instructions for students<textarea name="instructions" rows="4">${esc(e.instructions)}</textarea></label>
        <div class="grid3"><label class="field">Time limit (minutes)<span class="hint">Leave empty for no limit</span><input type="number" name="limit" min="1" value="${e.time_limit_min ?? ""}"></label>
          <label class="field">Opens<span class="hint">Empty = open once published</span><input type="datetime-local" name="opens" value="${toLocalInput(e.opens_at)}"></label>
          <label class="field">Closes<span class="hint">Empty = never closes</span><input type="datetime-local" name="closes" value="${toLocalInput(e.closes_at)}"></label></div>
        <div class="row"><label class="check"><input type="checkbox" name="show" ${e.show_results ? "checked" : ""}> Show students their score right after submitting</label><label class="check"><input type="checkbox" name="published" ${e.published ? "checked" : ""}> Published</label></div>
      </div>
      <div class="row"><h2 style="flex:1">Questions</h2><span class="small muted" id="qTotal"></span></div>
      <div id="qList"></div>
      <div class="row"><span class="small muted">Add:</span>${Object.entries(QKIND).map(([k, l]) => `<button type="button" class="btn sm" data-addq="${k}">${ic("plus")} ${l}</button>`).join("")}</div>
      <div class="row" style="justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px"><a class="btn" href="${id ? "#/exams/" + id : "#/exams"}">Cancel</a><button class="btn primary" type="submit">${ic("check")} Save exam</button></div>
    </form>`);
  if (!ok) return;
  const list = $("#qList");
  const draw = () => {
    list.innerHTML = qs.map((q, i) => `<div class="qedit" data-i="${i}">
      <div class="row" style="margin-bottom:8px"><b>Question ${i + 1}</b><span class="chip accent">${QKIND[q.kind]}</span><span class="spacer"></span>
        <label class="row small" style="gap:6px">Points <input type="number" min="0" step="any" style="width:80px" data-f="points" value="${esc(q.points)}"></label>
        <button type="button" class="btn sm ghost icon" data-q="up" ${i === 0 ? "disabled" : ""} aria-label="Move up">${ic("up")}</button><button type="button" class="btn sm ghost icon" data-q="down" ${i === qs.length - 1 ? "disabled" : ""} aria-label="Move down">${ic("down")}</button><button type="button" class="btn sm ghost icon" data-q="del" aria-label="Remove question">${ic("trash")}</button></div>
      <textarea rows="2" data-f="prompt" placeholder="Question text">${esc(q.prompt)}</textarea>
      ${q.kind === "mc" ? `<div class="opts" style="margin-top:10px"><div class="small muted" style="margin-bottom:6px">Options: select the correct one</div>${q.options.map((o, j) => `<div class="row"><input type="radio" name="key_${i}" data-key="${j}" ${String(q.answer) === String(j) ? "checked" : ""} aria-label="Correct answer"><input type="text" data-opt="${j}" value="${esc(o)}" placeholder="Option ${j + 1}"><button type="button" class="btn sm ghost icon" data-delopt="${j}" ${q.options.length <= 2 ? "disabled" : ""} aria-label="Remove option">${ic("x")}</button></div>`).join("")}<button type="button" class="btn sm" data-addopt>${ic("plus")} Option</button></div>`
      : q.kind === "tf" ? `<div class="row" style="margin-top:10px"><span class="small muted">Correct answer:</span><label class="check"><input type="radio" name="key_${i}" data-tf="true" ${q.answer === true ? "checked" : ""}> True</label><label class="check"><input type="radio" name="key_${i}" data-tf="false" ${q.answer === false ? "checked" : ""}> False</label></div>`
      : q.kind === "short" ? `<label class="field" style="margin-top:10px">Accepted answers <span class="hint">One per line; capitals and extra spaces are ignored. Leave empty to mark by hand.</span><textarea rows="2" data-f="accepted">${esc(Array.isArray(q.answer) ? q.answer.join("\n") : "")}</textarea></label>`
      : `<p class="small muted" style="margin:8px 0 0">You'll mark essay answers by hand in Review.</p>`}</div>`).join("") || `<div class="card">${empty("exam", "No questions yet. Add one below.")}</div>`;
    $("#qTotal").textContent = qs.length ? `${qs.length} question${qs.length === 1 ? "" : "s"} · ${fmtNum(qs.reduce((s, q) => s + (Number(q.points) || 0), 0))} points` : "";
  };
  draw();
  list.addEventListener("input", ev => {
    const box = ev.target.closest(".qedit"); if (!box) return; const q = qs[+box.dataset.i], el = ev.target;
    if (el.dataset.f === "prompt") q.prompt = el.value;
    else if (el.dataset.f === "points") { q.points = num(el.value) ?? 0; $("#qTotal").textContent = `${qs.length} questions · ${fmtNum(qs.reduce((s, x) => s + (Number(x.points) || 0), 0))} points`; }
    else if (el.dataset.f === "accepted") q.answer = el.value.split("\n").map(s => s.trim()).filter(Boolean);
    else if (el.dataset.opt !== undefined) q.options[+el.dataset.opt] = el.value;
  });
  list.addEventListener("change", ev => {
    const box = ev.target.closest(".qedit"); if (!box) return; const q = qs[+box.dataset.i], el = ev.target;
    if (el.dataset.key !== undefined) q.answer = Number(el.dataset.key);
    if (el.dataset.tf !== undefined) q.answer = el.dataset.tf === "true";
  });
  list.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return; const box = b.closest(".qedit"); const i = +box.dataset.i, q = qs[i];
    if (b.dataset.q === "del") qs.splice(i, 1);
    else if (b.dataset.q === "up") [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]];
    else if (b.dataset.q === "down") [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]];
    else if (b.dataset.addopt !== undefined) q.options.push("");
    else if (b.dataset.delopt !== undefined) { const j = +b.dataset.delopt; q.options.splice(j, 1); if (q.answer === j) q.answer = null; else if (q.answer > j) q.answer--; }
    else return;
    draw();
  });
  $$("[data-addq]").forEach(b => b.onclick = () => {
    const k = b.dataset.addq;
    qs.push({ id: uid(), _new: true, kind: k, prompt: "", points: k === "essay" ? 5 : 1, options: k === "mc" ? ["", "", "", ""] : [], answer: k === "short" ? [] : null });
    draw(); list.lastElementChild?.querySelector("textarea")?.focus();
  });
  $("#exForm").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    const title = fval(f, "title"); if (!title) { toast("Give the exam a title.", true); f.elements.title.focus(); return; }
    for (const [i, q] of qs.entries()) {
      const n = `Question ${i + 1}: `;
      if (!q.prompt.trim()) { toast(n + "write the question.", true); return; }
      if (q.kind === "mc") { q.options = q.options.map(o => o.trim()); if (q.options.filter(Boolean).length < 2 || q.options.some(o => !o)) { toast(n + "fill in every option (at least two), or remove empty ones.", true); return; } if (q.answer === null || q.answer === undefined || q.answer >= q.options.length) { toast(n + "select the correct option.", true); return; } }
      if (q.kind === "tf" && typeof q.answer !== "boolean") { toast(n + "choose True or False as the correct answer.", true); return; }
    }
    const opens = fromLocalInput(f.elements.opens.value), closes = fromLocalInput(f.elements.closes.value);
    if (opens && closes && closes <= opens) { toast("The closing time must be after the opening time.", true); return; }
    if (f.elements.published.checked && !qs.length) { toast("Add at least one question before publishing.", true); return; }
    const btn = $("button[type=submit]", f); btn.disabled = true;
    try {
      const saved = await st.save("exams", { id: id || undefined, title, instructions: f.elements.instructions.value, time_limit_min: num(f.elements.limit.value), opens_at: opens, closes_at: closes, show_results: f.elements.show.checked, published: f.elements.published.checked });
      const examId = saved.id;
      for (const old of origIds.filter(x => !qs.some(q => q.id === x))) await st.remove("exam_questions", old);
      for (const [i, q] of qs.entries()) await st.save("exam_questions", { id: q.id, exam_id: examId, position: i + 1, kind: q.kind, prompt: q.prompt, options: q.kind === "mc" ? q.options : [], points: Number(q.points) || 0 }, "id", { insert: !!q._new });
      await st.removeWhere("exam_keys", "question_id", qs.map(q => q.id));
      await st.insertMany("exam_keys", qs.filter(q => (q.kind === "mc" || q.kind === "tf") ? q.answer !== null && q.answer !== undefined : q.kind === "short" && Array.isArray(q.answer) && q.answer.length).map(q => ({ question_id: q.id, answer: q.answer })));
      toast("Exam saved"); location.hash = "#/exams/" + examId;
    } catch (err) { toast(errMsg(err), true); btn.disabled = false; }
  };
}

      .sort((a, b) => (b.unread - a.unread) || String(b.last?.created_at || "").localeCompare(String(a.last?.created_at || "")) || displayName(a.p).localeCompare(displayName(b.p)));

      <div class="msgs" id="msgs"></div>

    : `<div class="thread">${empty("chat", "Choose a student to read or start a conversation.")}</div>`;

    `<div class="card ${t ? "inbox" : ""}" style="overflow:hidden">${listHtml}${threadHtml}</div>`);
  if (!ok || !studentId) return;
  const box = $("#msgs");
  const draw = list => {
    const ms = list.filter(m => m.student_id === studentId).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    box.innerHTML = ms.map(m => { const mine = m.sender_id === S.me.id, who = people.find(p => p.id === m.sender_id); return `<div class="bubble ${mine ? "me" : "them"}">${esc(m.body)}<span class="when">${mine ? "You" : esc(displayName(who))} · ${fmtDate(m.created_at)}</span></div>`; }).join("") || `<div class="empty">${t ? "No messages yet. Say hello!" : "No messages yet. Questions about an assignment or the course? Write below."}</div>`;
    if (atBottom || !box.dataset.drawn) box.scrollTop = box.scrollHeight;
    box.dataset.drawn = 1;
    if (ms.some(m => !m.read_at && m.sender_id !== S.me.id)) st.markRead(studentId).then(refreshBadges).catch(() => {});

  const ok = paint(tok, head("Gradebook", "Every student's score on every published assignment and exam.", `<button class="btn" id="csv">${ic("download")} Export CSV</button>`) + `
    <div class="card"><div class="table-wrap"><table class="t"><thead><tr><th>Student</th>${items.map(it => `<th class="num" title="${esc(it.title)}"><a href="${it.href}" style="color:inherit">${esc(it.title.length > 22 ? it.title.slice(0, 21) + "…" : it.title)}</a><div class="tiny" style="font-weight:400">${it.kind}${it.max ? " · " + fmtNum(it.max) : ""}</div></th>`).join("")}<th class="num">Overall</th></tr></thead><tbody>
    ${students.map(p => `<tr><td><div class="row" style="flex-wrap:nowrap">${avatar(p)}<b>${esc(displayName(p))}</b></div></td>${items.map(it => { const s = it.score(p.id); const subd = it.kind === "Assignment" ? it.status(p.id) : res.find(x => x.exam_id === it.id && x.student_id === p.id); return `<td class="num">${s !== null ? fmtNum(s) : subd ? `<span class="chip warn">to grade</span>` : `<span class="muted">–</span>`}</td>`; }).join("")}<td class="num"><b>${pct(p.id) === null ? "–" : pct(p.id) + "%"}</b></td></tr>`).join("") || `<tr><td colspan="${items.length + 2}">${empty("people", "No students yet.")}</td></tr>`}
    </tbody></table></div></div>`);
  if (ok) $("#csv").onclick = () => saveBlob(new Blob([csv([["Student", "Email", ...items.map(it => `${it.title} (${it.kind})`), "Overall %"], ...students.map(p => [displayName(p), p.email, ...items.map(it => it.score(p.id) ?? ""), pct(p.id) ?? ""])])], { type: "text/csv" }), safeFile(S.course.code || S.course.title) + "-gradebook.csv");
};

/* =============================== people =============================== */
ROUTES.people = async tok => {
  if (!isT()) { location.hash = "#/home"; return; }
  const st = store();
  const [people, subs] = await Promise.all([st.list("profiles"), st.list("submissions")]);
  const students = people.filter(p => p.role === "student").sort((x, y) => displayName(x).localeCompare(displayName(y)));
  const teachers = people.filter(p => p.role === "instructor");
  const site = location.origin + location.pathname;
  const ok = paint(tok, head("People", `${students.length} student${students.length === 1 ? "" : "s"} and ${teachers.length} instructor${teachers.length === 1 ? "" : "s"}.`) + `
    <div class="card pad" style="margin-bottom:18px"><div class="row"><span class="tile t-teal">${ic("mail")}</span><div style="flex:1;min-width:220px"><b>Invite students</b><div class="small muted">${DEMO ? "In demo mode you can add pretend students below." : "Share this link. Students sign in with their email address and appear here after their first sign-in."}</div></div>
      ${DEMO ? `<form class="row" id="addForm"><input type="text" name="name" placeholder="Student's full name" style="width:220px" required><button class="btn primary">${ic("plus")} Add demo student</button></form>` : `<code class="answer-box" style="padding:6px 10px">${esc(site)}</code><button class="btn" id="copy">${ic("link")} Copy link</button>`}</div></div>
    <div class="card"><div class="table-wrap"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th class="num">Submissions</th><th></th></tr></thead><tbody>
    ${[...teachers, ...students].map(p => `<tr><td><div class="row" style="flex-wrap:nowrap">${avatar(p)}<b>${esc(displayName(p))}</b></div></td><td class="small">${esc(p.email)}</td><td>${p.role === "instructor" ? `<span class="chip accent">Instructor</span>` : `<span class="chip">Student</span>`}</td><td class="small">${fmtDay(p.created_at)}</td><td class="num">${p.role === "student" ? subs.filter(s => s.student_id === p.id).length : ""}</td><td>${p.role === "student" ? `<a class="btn sm" href="#/messages/${p.id}">${ic("chat")} Message</a>` : ""}</td></tr>`).join("")}
    </tbody></table></div></div>`);
  if (!ok) return;
  $("#copy")?.addEventListener("click", () => navigator.clipboard.writeText(site).then(() => toast("Link copied"), () => toast("Couldn't copy. Select the link and copy it.", true)));
  $("#addForm")?.addEventListener("submit", async e => { e.preventDefault(); const n = e.target.elements.name.value.trim(); if (!n) return; await st.addDemoStudent(n); toast(n + " added"); render(); });
};

/* ============================== settings ============================== */
ROUTES.settings = async tok => {
  if (!isT()) { location.hash = "#/home"; return; }
  const c = await store().getCourse();
  const ok = paint(tok, head("Course settings", "The name and description students see.") + `
    <form class="card pad stack" id="courseForm">
      <label class="field">Course title<input type="text" name="title" required maxlength="120" value="${esc(c.title)}"></label>
      <div class="grid2"><label class="field">Course code<input type="text" name="code" maxlength="40" value="${esc(c.code)}" placeholder="SQL 101"></label><label class="field">Term<input type="text" name="term" maxlength="40" value="${esc(c.term)}" placeholder="Fall 2026"></label></div>
      <label class="field">Description <span class="hint">Shown on everyone's home page.</span><textarea name="description" rows="5">${esc(c.description)}</textarea></label>
      <div class="row" style="justify-content:flex-end"><button class="btn primary">${ic("check")} Save</button></div>
    </form>
    ${DEMO ? `<div class="card pad" style="margin-top:18px"><h2>Going live</h2><p class="muted" style="margin-top:6px">This site is in <b>demo mode</b>: data lives only in this browser and anyone can switch roles. To use it with real students:</p>
      <ol class="md" style="padding-left:20px"><li>Create a free project at <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>.</li><li>In its <b>SQL Editor</b>, run <code>supabase/setup.sql</code> after putting your email in the first lines.</li><li>Paste the project's URL and anon key into <code>config.js</code>, and upload it to GitHub.</li><li>In Supabase, go to <b>Authentication → URL Configuration</b> and set <b>Site URL</b> to your GitHub Pages address.</li></ol>
      <p class="muted">The full walkthrough is in <b>README.md</b>.</p><button class="btn danger" id="reset">${ic("refresh")} Reset demo data</button></div>` : ""}`);
  if (!ok) return;
  $("#courseForm").onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    if (!fval(f, "title")) { toast("Add a course title.", true); return; }
    try { S.course = await store().save("course", { title: fval(f, "title"), code: fval(f, "code"), term: fval(f, "term"), description: f.elements.description.value }); toast("Course updated"); renderShell(); render(); }
    catch (err) { toast(errMsg(err), true); }
  };
  $("#reset")?.addEventListener("click", async () => { if (await confirmBox("Reset the demo?", "This puts back the sample course and removes everything you added in demo mode.", "Reset")) { store().reset(); location.reload(); } });
};

/* =============================== sign-in =============================== */
function authError(e) {
  const m = errMsg(e);
  if (/invalid login credentials/i.test(m)) return "That email and password don't match. Check them, or use “Forgot password?”.";
  if (/email not confirmed/i.test(m)) return "Please confirm your email first. Open the link we sent you, then sign in.";
  if (/already registered|already been registered/i.test(m)) return "There's already an account with this email. Sign in instead.";
  if (/rate limit|too many/i.test(m)) return "Too many emails were sent recently. Please wait a few minutes and try again, or sign in with your password.";
  if (/password should be|weak password/i.test(m)) return "Choose a longer password (at least 8 characters).";
  return m;
}
function renderLogin(course, err) {
  $("#app").innerHTML = `<div class="auth"><div class="card">
    <img class="auth-logo" alt="Dawit Demissie — SELECT * FROM sql_lessons;">
    <h1 style="text-align:center;font-size:22px">${esc(course?.title || "Learning Platform")}</h1>
    <p class="muted" style="text-align:center;margin:6px 0 18px">${esc([course?.code, course?.term].filter(Boolean).join(" · ")) || "Sign in to continue"}</p>
    <div class="seg" role="tablist" style="display:flex;background:var(--hover);border-radius:10px;padding:3px;margin-bottom:18px">
      ${[["in", "Sign in"], ["up", "Create account"], ["link", "Email link"]].map(([k, l]) => `<button type="button" role="tab" class="btn ghost sm" data-mode="${k}" style="flex:1">${l}</button>`).join("")}
    </div>
    <form id="authForm" class="stack" novalidate>
      <label class="field m-up">Full name<input type="text" name="name" autocomplete="name" maxlength="80"></label>
      <label class="field">Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
      <label class="field m-in m-up">Password <span class="hint m-up">At least 8 characters.</span><input type="password" name="password" autocomplete="current-password"></label>
      <button class="btn primary" type="submit" style="min-height:42px" id="authBtn"></button>
      <p class="small muted m-link" style="margin:0;text-align:center">No password needed: we'll email you a link that signs you in.</p>
      <p class="m-in" style="margin:0;text-align:center"><button type="button" class="btn ghost sm" id="forgot">Forgot password?</button></p>
    </form>
    <div id="sent" class="hidden" style="text-align:center"><span class="tile t-teal" style="margin:0 auto 12px">${ic("mail")}</span><h2>Check your email</h2><p class="muted" style="margin-top:6px" id="sentMsg"></p><button class="btn" id="again">Back</button></div>
    ${err ? `<div class="card pad" style="margin-top:16px;border-color:var(--err);background:var(--err-soft)">${esc(err)}</div>` : ""}
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn ghost sm" id="themeBtn"></button></div>
  </div></div>`;
  updateThemeUi();
  $("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  const form = $("#authForm"), btn = $("#authBtn");
  let mode = "in";
  const setMode = m => {
    mode = m;
    $$("[data-mode]").forEach(b => { const on = b.dataset.mode === m; b.style.background = on ? "var(--raise)" : ""; b.style.boxShadow = on ? "var(--shadow)" : ""; b.setAttribute("aria-selected", on); });
    $$(".m-in,.m-up,.m-link", form).forEach(el => el.classList.toggle("hidden", !el.classList.contains("m-" + m)));
    form.elements.password.autocomplete = m === "up" ? "new-password" : "current-password";
    btn.innerHTML = m === "in" ? `${ic("logout")} Sign in` : m === "up" ? `${ic("user")} Create my account` : `${ic("mail")} Email me a sign-in link`;
  };
  $$("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  setMode("in");
  const sent = msg => { $("#sentMsg").innerHTML = msg; form.classList.add("hidden"); $("#sent").classList.remove("hidden"); };
  form.onsubmit = async e => {
    e.preventDefault();
    const email = form.elements.email.value.trim(), pw = form.elements.password.value, name = form.elements.name.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast("Enter a valid email address.", true); return; }
    if (mode === "up" && !name) { toast("Enter your full name.", true); return; }
    if (mode !== "link" && pw.length < (mode === "up" ? 8 : 1)) { toast(mode === "up" ? "Choose a password of at least 8 characters." : "Enter your password.", true); return; }
    btn.disabled = true;
    try {
      if (mode === "in") { await store().signInPassword(email, pw); location.reload(); return; }
      if (mode === "up") {
        const signedIn = await store().signUp(name, email, pw);
        if (signedIn) { location.reload(); return; }
        sent(`We sent a confirmation link to <b>${esc(email)}</b>. Open it to finish creating your account.`);
      } else { await store().signIn(email); sent(`We sent a sign-in link to <b>${esc(email)}</b>. Open it on this device. It can take a minute; check your spam folder too.`); }
    } catch (err2) { toast(authError(err2), true); }
    finally { btn.disabled = false; }
  };
  $("#forgot").onclick = async () => {
    const email = form.elements.email.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast("Type your email address first, then click “Forgot password?”.", true); form.elements.email.focus(); return; }
    try { await store().resetPassword(email); sent(`If <b>${esc(email)}</b> has an account, we've sent it a link to choose a new password.`); }
    catch (err2) { toast(authError(err2), true); }
  };
  $("#again").onclick = () => { $("#sent").classList.add("hidden"); form.classList.remove("hidden"); };
}

/* ================================ boot ================================ */
async function boot() {
  window.addEventListener("hashchange", render);
  let recovery = false;
  try {
    if (DEMO) {
      S.store = new LocalStore();
      S.me = await S.store.session();
    } else {
      const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
      const linkError = hashParams.get("error_description");
      recovery = hashParams.get("type") === "recovery";
      S.store = new SupaStore();
      await S.store.init();
      S.me = await S.store.session();
      if (/access_token|error_description/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search + "#/home");
      S.store.sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") location.reload(); });
      if (!S.me) {
        let course = null; try { course = await S.store.getCourse(); } catch {}
        return renderLogin(course, linkError ? linkError.replace(/\+/g, " ") + ". Please request a new link." : "");
      }
    }
    S.course = await S.store.getCourse();
    renderShell();
    await render();
    if (!DEMO && recovery) askPassword(true);
    else if (!DEMO && !S.me.full_name) askName(true);
  } catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="auth"><div class="card"><img class="auth-logo" alt="Dawit Demissie"><h2>We couldn't start the site</h2><p class="muted" style="margin-top:8px">${esc(errMsg(e))}</p>${DEMO ? "" : `<p class="small muted">If you're the instructor: check the values in <code>config.js</code>, and that <code>supabase/setup.sql</code> has been run.</p>`}<button class="btn" onclick="location.reload()">${ic("refresh")} Try again</button></div></div>`;
    updateThemeUi();
  }
}
boot();

</script>
